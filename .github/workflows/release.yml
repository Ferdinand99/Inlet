name: Release

# Builds Inlet on all three platforms and publishes a GitHub release. Two ways in:
#
# - release-please.yml calls this workflow with the tag it has just created. A tag
#   created with the default GITHUB_TOKEN does not start other workflows, so the call
#   is explicit. release-please has already made a draft pre-release for the tag
#   (with the changelog as notes); this workflow attaches the files to it and
#   publishes it.
# - Pushing a tag that starts with "v" by hand. If no release exists for the tag, one
#   is created.
#
# Every release is a pre-release and is never marked as the latest release. The macOS
# build is signed and notarised by macos-sign.yml, which waits for approval in the
# protected environment "release".

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to build and release (vX.Y.Z); it must point at the commit of the calling run
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The build below uses the commit of this run. Make sure that is the commit the tag
  # names, so the release never holds files built from a different commit.
  verify:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: The tag is a version tag and points at this commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag"
            exit 1
          fi
          read -r type sha < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object | "\(.type) \(.sha)"')
          if [ "$type" = tag ]; then
            sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)"
          fi
          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG points at $sha, but this run builds $GITHUB_SHA"
            exit 1
          fi
          echo "$TAG is at $sha"

  build:
    name: Build
    needs: verify
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  # Signs and notarises the macOS app and DMG in the protected environment
  # "release". The run waits here until it is approved.
  macos-sign:
    name: macOS signing
    needs: build
    uses: ./.github/workflows/macos-sign.yml
    # The secrets of the "release" environment only reach the called workflow
    # when the caller lets secrets through. The repository holds no others.
    secrets: inherit
    permissions:
      contents: read
    with:
      app-artifact: inlet-macos-aarch64-app
      dmg-artifact: inlet-macos-aarch64-dmg
      retention-days: 7

  release:
    name: Create release
    needs: [build, macos-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir release
          cp artifacts/inlet-windows-x86_64/inlet.exe release/inlet-windows-x86_64.exe
          cp artifacts/inlet-macos-aarch64-dmg/inlet-macos-aarch64.dmg release/
          cp artifacts/inlet-linux-x86_64/inlet-linux-x86_64.tar.gz release/
          cp LICENSE release/LICENSE
          # Third-party licence notices, if the repository carries them.
          for f in THIRD-PARTY-NOTICES*; do
            if [ -f "$f" ]; then cp "$f" release/; fi
          done
          cd release
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l

      - name: Write release notes
        run: |
          cat > notes.md <<'NOTES'
          **Beta, not stable.** Expect bugs and missing features. Do not rely on Inlet for anything important yet.

          Inlet works with Fluxer, an independent project that is not made or endorsed by Fluxer Platform AB. "Fluxer" is their trademark.

          ## Downloads

          - Windows (x86_64): `inlet-windows-x86_64.exe`. The file is not code-signed, so Windows SmartScreen may warn you. Choose "More info", then "Run anyway".
          - macOS (Apple silicon, macOS 12 or later): `inlet-macos-aarch64.dmg`. Signed with a Developer ID and notarised by Apple. Open the DMG and drag Inlet to Applications.
          - Linux (x86_64): `inlet-linux-x86_64.tar.gz`.

          Check the downloads against `SHA256SUMS.txt`. Licence notices for third-party code are in the `THIRD-PARTY-NOTICES` file when it is attached.
          NOTES

      # A draft release for the tag exists when release-please made the tag: its
      # notes are the changelog. The draft is filled with the files and published as a
      # pre-release. Without a draft (a tag pushed by hand) the release is created.
      # A release that is already published is never touched: one tag, one release.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag"
            exit 1
          fi
          title="Inlet $TAG (beta)"

          # Drafts are not found by tag name, so look through the list of releases.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | [.id, .draft] | @tsv' > found.tsv
          count="$(wc -l < found.tsv)"
          if [ "$count" -gt 1 ]; then
            echo "::error::$count releases exist for $TAG"
            exit 1
          fi

          if [ "$count" -eq 0 ]; then
            # Every release is a pre-release and nothing is ever the latest release.
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$title" \
              --notes-file notes.md \
              --prerelease \
              --latest=false
          else
            read -r id draft < found.tsv
            if [ "$draft" != true ]; then
              echo "::error::$TAG already has a published release; not touching it"
              exit 1
            fi

            # Notes: the beta notice and downloads, then release-please's changelog.
            gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq '.body // ""' > changelog.md
            { cat notes.md; echo; cat changelog.md; } > body.md

            # A re-run starts again: drop assets of the same name first.
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" \
              --jq '.[] | [.id, .name] | @tsv' > assets.tsv
            for f in release/*; do
              name="$(basename "$f")"
              while IFS=$'\t' read -r asset_id asset_name; do
                if [ "$asset_name" = "$name" ]; then
                  gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
                fi
              done < assets.tsv
              gh api --method POST \
                -H "Content-Type: application/octet-stream" \
                --input "$f" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$name" \
                --jq '"uploaded \(.name)"'
            done

            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -f name="$title" \
              -F body=@body.md \
              -F draft=false \
              -F prerelease=true \
              -f make_latest=false \
              --jq '"published \(.tag_name): draft=\(.draft) prerelease=\(.prerelease)"'
          fi

      # Fail loudly if the result is not a pre-release or is the latest release.
      - name: Check that the release is a pre-release and not the latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | [.draft, .prerelease] | @tsv' > state.tsv
          cat state.tsv
          if [ "$(cat state.tsv)" != "$(printf 'false\ttrue')" ]; then
            echo "::error::$TAG must be exactly one published pre-release"
            exit 1
          fi
          # 404 when no release is the latest, which is fine for a first pre-release.
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
          echo "Latest release: ${latest:-none}"
          if [ "$latest" = "$TAG" ]; then
            echo "::error::$TAG is marked as the latest release"
            exit 1
          fi
