name: Release

# Pushing a tag that starts with "v" builds Inlet on all three platforms and
# creates a GitHub Release. Releases are always marked as pre-releases while
# the version starts with 0 or has a pre-release suffix, and are never "latest".
# The macOS build is signed and notarised by macos-sign.yml, which waits for
# approval in the protected environment "release".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  # Signs and notarises the macOS app and DMG in the protected environment
  # "release". The run waits here until it is approved.
  macos-sign:
    name: macOS signing
    needs: build
    uses: ./.github/workflows/macos-sign.yml
    # The secrets of the "release" environment only reach the called workflow
    # when the caller lets secrets through. The repository holds no others.
    secrets: inherit
    permissions:
      contents: read
    with:
      app-artifact: inlet-macos-aarch64-app
      dmg-artifact: inlet-macos-aarch64-dmg
      retention-days: 7

  # A CycloneDX SBOM per platform (sbom.yml); the release job attaches them.
  sbom:
    name: SBOM
    uses: ./.github/workflows/sbom.yml
    permissions:
      contents: read

  release:
    name: Create release
    needs: [build, macos-sign, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir release
          cp artifacts/inlet-windows-x86_64/inlet.exe release/inlet-windows-x86_64.exe
          cp artifacts/inlet-macos-aarch64-dmg/inlet-macos-aarch64.dmg release/
          cp artifacts/inlet-linux-x86_64/inlet-linux-x86_64.tar.gz release/
          # One SBOM per platform build (CycloneDX, JSON).
          cp artifacts/inlet-sbom-*/*.cdx.json release/
          sboms=(release/*.cdx.json)
          test "${#sboms[@]}" -eq 3
          cp LICENSE release/LICENSE
          # Third-party licence notices, if the repository carries them.
          for f in THIRD-PARTY-NOTICES*; do
            if [ -f "$f" ]; then cp "$f" release/; fi
          done
          cd release
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l

      # LICENSE and THIRD-PARTY-NOTICES (which holds the licences of the fonts, icons and
      # Twemoji) are in the release and inside the Linux archive; the check fails the
      # release when one of them is missing or lost its licence texts.
      - name: Check the licence files
        run: scripts/check-package-licences.sh release

      # The attest job below attests exactly these files, the ones that are published.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 7

      - name: Write release notes
        run: |
          cat > notes.md <<'NOTES'
          **Beta, not stable.** Expect bugs and missing features. Do not rely on Inlet for anything important yet.

          Inlet works with Fluxer, an independent project that is not made or endorsed by Fluxer Platform AB. "Fluxer" is their trademark.

          ## Downloads

          - Windows (x86_64): `inlet-windows-x86_64.exe`. The file is not code-signed, so Windows SmartScreen may warn you. Choose "More info", then "Run anyway".
          - macOS (Apple silicon, macOS 12 or later): `inlet-macos-aarch64.dmg`. Signed with a Developer ID and notarised by Apple. Open the DMG and drag Inlet to Applications.
          - Linux (x86_64): `inlet-linux-x86_64.tar.gz`.

          Check the downloads against `SHA256SUMS.txt`. Licence notices for third-party code are in the `THIRD-PARTY-NOTICES` file when it is attached.
          NOTES

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Every v0.* tag and every tag with a suffix (v1.0.0-beta.1) is a pre-release.
          # Nothing is ever marked as the latest release.
          prerelease=false
          case "$TAG" in
            v0.*|*-*) prerelease=true ;;
          esac
          flags=(--latest=false)
          if [ "$prerelease" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Inlet $TAG (beta)" \
            --notes-file notes.md \
            "${flags[@]}"

  # Build provenance (SLSA, signed with Sigstore) for every file in the release: the
  # three downloads, the three SBOMs, LICENSE, THIRD-PARTY-NOTICES and SHA256SUMS.txt.
  # It ties each file to this workflow run and this commit. Anyone can check a download:
  #
  #   gh attestation verify <file> --repo Ferdinand99/Inlet
  #
  # This is the only job with the two extra permissions, and it runs no repository code:
  # it downloads the files the release job just published and signs their digests.
  attest:
    name: Build provenance
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-files/*
