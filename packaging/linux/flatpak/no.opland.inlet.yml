# Flatpak manifest for the release bundle (inlet-<version>-linux-x86_64.flatpak).
#
# It packs the release binary that CI has already built; build-flatpak.sh stages that
# binary next to this file together with the desktop entry, the metainfo, the icons and
# the licence files, and runs flatpak-builder on the staged folder. Nothing else is
# downloaded into the app: the runtime comes from Flathub.
#
# The GNOME runtime is used because it ships WebKitGTK 4.1, which the embedded web
# helper (inlet-web, installed next to inlet when the build has it) needs for the
# in-app sign-in and similar pages. The runtime is on a rolling branch of Flathub, so the
# bundle uses `runtime-repo` to let `flatpak install` fetch it.
app-id: no.opland.inlet
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: inlet

# The narrowest set that the features need. There is no filesystem access at all: the
# file chooser, saving and opening links go through the desktop portals. Each line says
# what it is for; remove the line and that feature stops, nothing else.
finish-args:
  # Servers are reached over the network (HTTPS and WebSocket).
  - --share=network
  # The window: Wayland, and X11 only where there is no Wayland. IPC is X11 shared memory.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU rendering (Vulkan).
  - --device=dri
  # The notification sound.
  - --socket=pulseaudio
  # Desktop notifications.
  - --talk-name=org.freedesktop.Notifications
  # The tray icon (StatusNotifierItem) and its menu. The item is named
  # org.kde.StatusNotifierItem-<pid>-1 and the app is process 2 inside the sandbox.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-2-1
  # The sign-in token and other secrets are kept in the system keyring.
  - --talk-name=org.freedesktop.secrets
  # Idle time for the "away" status (KDE and GNOME).
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.Mutter.IdleMonitor

modules:
  - name: inlet
    buildsystem: simple
    build-commands:
      - install -Dm755 inlet /app/bin/inlet
      # The embedded web helper, when this build has one.
      - if [ -f inlet-web ]; then install -Dm755 inlet-web /app/bin/inlet-web; fi
      - install -Dm644 no.opland.inlet.desktop /app/share/applications/no.opland.inlet.desktop
      - install -Dm644 no.opland.inlet.metainfo.xml /app/share/metainfo/no.opland.inlet.metainfo.xml
      - mkdir -p /app/share/icons && cp -r icons/hicolor /app/share/icons/hicolor
      - install -Dm644 LICENSE /app/share/licenses/no.opland.inlet/LICENSE
      - install -Dm644 THIRD-PARTY-NOTICES /app/share/licenses/no.opland.inlet/THIRD-PARTY-NOTICES
    sources:
      - type: dir
        path: .
