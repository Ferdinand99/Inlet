[package]
name = "inlet-web"
description = "The embedded web view: a helper program that shows one web page in its own window, and the client that talks to it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["helper", "client"]
# The helper program `inlet-web` (wry and tao). Off for the app, which only needs the
# protocol and the client; the app finds the helper next to its own executable.
helper = ["dep:wry", "dep:tao"]
# The client: starts the helper and reads its events.
client = ["dep:tokio", "dep:futures-core"]
# Accept plain http on loopback (and an IP address as the host, there), and the small web
# server of the tests and the demo. For tests and the demo only: refused in release builds.
loopback = []
# The helper for the tests against a local server: `loopback`, and on Linux trust any
# certificate and let scripts open windows. For tests only: refused in release builds.
test-loopback = ["helper", "loopback", "dep:webkit2gtk"]

[[bin]]
name = "inlet-web"
path = "src/main.rs"
required-features = ["helper"]

[[test]]
name = "basics"
path = "tests/basics.rs"
required-features = ["helper"]

[[test]]
name = "helper"
path = "tests/helper.rs"
required-features = ["helper", "client", "test-loopback"]

[[example]]
name = "web_demo"
path = "examples/web_demo.rs"
required-features = ["helper", "client", "test-loopback"]

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

futures-core = { version = "0.3", optional = true }
# The version of wry and tao is pinned: the helper's rules (which navigations, windows and
# downloads it blocks) depend on their callbacks, so an update gets a review.
tao = { version = "=0.37.1", optional = true }
tokio = { version = "1", optional = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
wry = { version = "=0.57.1", optional = true }

# The same version wry uses (it must match to share the types). Only the test-loopback
# build touches it.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", optional = true }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
